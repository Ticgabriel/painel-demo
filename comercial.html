(function(root){

function monthISO(x){

 $('prev').disabled=state.page===1;$('next').disabled=state.page===pages;$('prev').onclick=()=>{state.page--;drawTable();};$('next').onclick=()=>{state.page++;drawTable();};OSUX.decorate(columnLabels,draw);$('table').scrollTop=scroll.top||0;$('table').scrollLeft=scroll.left||0;

let tourIndex=-1,tourTarget=null,tourFocus=null,tourFilterOpen=false;
