function gridFooter(){return `<div class="gridFooter"><span id="selectionInfo">${selected.size} linha(s) selecionada(s) · ${sortKey?'Ordenado por '+FM[sortKey][1]:'Ordem manual'}</span><span>Duplo clique/F2: editar · Shift: selecionar intervalo · Ctrl C/V: células · Alt ↑/↓: linhas</span></div><div class="hint">Números à esquerda selecionam linhas inteiras. Ctrl + clique permite seleção múltipla. Arraste o número para mover linhas. Campos calculados são somente leitura. Datas: dd/mm/aaaa.</div>`}
function grid(){return `<div class="tablewrap"><table class="sheet" aria-label="Tabela editável"><colgroup><col style="width:45px">${cols.map(k=>`<col style="width:${FM[k][2]}px">`).join('')}</colgroup><thead><tr><th class="num"><input type="checkbox" aria-label="Selecionar todas as linhas visíveis" ${visibleRows.length&&visibleRows.every(r=>selected.has(r.id))?'checked':''} onchange="selectAll(this.checked)"></th>${cols.map(k=>`<th><button onclick="sortBy('${k}')">${esc(FM[k][1])}${sortKey===k?(sortDir===1?' ↑':' ↓'):''}</button></th>`).join('')}</tr></thead><tbody>${visibleRows.map((r,i)=>`<tr data-id="${r.id}" class="${selected.has(r.id)?'rowSelected':''}"><td class="num" draggable="true" data-drag="${r.id}" data-rownum="${i}" title="Selecionar / arrastar linha">${i+1}</td>${cols.map((k,c)=>`<td tabindex="0" class="cell ${FM[k][2]>250?'long':''} ${FM[k][3]==='calc'?'readonly':''}" data-r="${i}" data-c="${c}" data-id="${r.id}" data-key="${k}" title="${esc(display(r,k))}">${esc(display(r,k))}</td>`).join('')}</tr>`).join('')}</tbody></table>${visibleRows.length?'':'<div class="empty">Nenhum registro neste filtro. <button onclick="clearFilters()">Limpar filtros</button></div>'}</div>`}
function agendaDate(r){return r.reviewDate||r.actionDue||''}
function board(){let groups=[['now','Resolver / verificar agora','Verificação ou ação para hoje e antes'],['later','Próximos compromissos','Verificação ou prazo depois da referência'],['none','Organizar a agenda','Sem verificação nem prazo da ação']];return `<div class="board">${groups.map(([key,label,sub])=>{let rs=visibleRows.filter(r=>key==='now'?(agendaDate(r)&&agendaDate(r)<=state.referenceDate):key==='later'?(agendaDate(r)&&agendaDate(r)>state.referenceDate):!agendaDate(r));return `<section class="lane" data-lane="${key}"><div class="laneTitle"><span>${label}</span>${badge(rs.length)}</div><p class="muted" style="font-size:11px;margin:0 4px 12px">${sub}</p>${rs.map(r=>`<article class="task ${selected.has(r.id)?'selected':''}" draggable="true" data-drag="${r.id}"><div class="tasktop"><div><h3>${esc(r.component||'Novo componente')}</h3><small>${esc(r.fleet)} · ${esc(r.site)}</small></div><input type="checkbox" aria-label="Selecionar ${esc(r.component)}" ${selected.has(r.id)?'checked':''} onchange="toggleRow('${r.id}',this.checked)"></div><div style="margin-top:9px">${badge(r.status)} ${overdue(r)?badge('Ação vencida','red'):''}</div><p class="description">${esc(r.nextAction||r.note||r.piecesNote||'Defina o próximo passo deste atendimento.')}</p><label>Próxima ação<input aria-label="Próxima ação ${esc(r.component)}" value="${esc(r.nextAction)}" onchange="editField('${r.id}','nextAction',this.value)"></label><div class="row" style="margin-top:8px;align-items:start"><label style="flex:1">Verificar em<input type="date" value="${r.reviewDate}" onchange="editField('${r.id}','reviewDate',this.value)"></label><label style="flex:1">Prazo da ação<input type="date" value="${r.actionDue}" onchange="editField('${r.id}','actionDue',this.value)"></label></div><div class="taskfoot"><small>${esc(r.os||'Ainda sem OS')}</small><button onclick="showDetail('${r.id}')">Abrir ficha ↗</button></div></article>`).join('')||'<div class="empty" style="padding:25px 5px">Arraste componentes function catalog(){return visibleRows.map(r=>{let n=Math.max(0,statuses.indexOf(r.status));return `<article class="component-item ${active===r.id?'active':''}" data-drag="${r.id}" draggable="true" onclick="active='${r.id}';render()"><input type="checkbox" aria-label="Selecionar ${esc(r.component)}" ${selected.has(r.id)?'checked':''} onclick="event.stopPropagation()" onchange="toggleRow('${r.id}',this.checked)">${badge(r.status)}<h3>${esc(r.component||'Novo componente')}</h3><p>${esc(r.fleet)} · ${esc(r.site)}</p><small>${esc(r.os||'Recebido sem OS')}</small><p>${esc(r.nextAction||r.note||'Próxima ação a definir')}</p><div class="progress">${[0,1,2,3,4].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div></article>`}).join('')||'<div class="empty">Nenhum registro.</div>'}
function field(r,k,wide=false){let f=FM[k],t=f?.[3],v=r[k]??'',opts=k==='status'?statuses:k==='situation'?situations:k==='decision'?['Aprovado','Reprovado','Não se aplica']:k==='invoice'?['Sim','Não','A confirmar']:null;return `<label class="${wide?'wide':''}">${esc(f?.[1]||k)}${opts?`<select data-field="${k}" onchange="editField('${r.id}','${k}',this.value)"><option value="">Não informado</option>${[...new Set([...opts,...(v?[v]:[])])].map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:['note','piecesNote','nextAction','internal'].includes(k)?`<textarea data-field="${k}" onchange="editField('${r.id}','${k}',this.value)">${esc(v)}</textarea>`:`<input data-field="${k}" type="${t==='date'?'date':k==='invoiceMonth'?'month':'text'}" value="${esc(t==='money'&&v!==''?String(v).replace('.',','):v)}" onchange="editField('${r.id}','${k}',this.value)">`}</label>`}
function detail(r,inModal){let tab=inModal?modalTab:detail.tab||'rotina';let tabsHTML=`<div class="tabs">${Object.entries({rotina:'Acompanhamento',dados:'Cadastro e valores',datas:'Datas e tempos',sap:'Referência SAP',history:'Histórico'}).map(([k,t])=>`<button class="${tab===k?'active':''}" onclick="${inModal?`modalTab='${k}';showDetail('${r.id}',true)`:`detail.tab='${k}';render()`}">${t}</button>`).join('')}</div>`;let inner='';
 if(tab==='rotina')inner=`<div class="formgrid">${['status','situation','forecast','piecesNote','note','nextAction','owner','actionDue','reviewDate','invoice','invoiceMonth','confirmed'].map(k=>field(r,k,['piecesNote','note','nextAction'].includes(k))).join('')}</div><div class="actionBanner"><button class="primary" onclick="confirmRow('${r.id}')">Conferido em ${date(state.referenceDate)}</button><button onclick="completeAction('${r.id}')">Concluir ação atual</button><button onclick="reviewTomorrow('${r.id}')">Verificar amanhã</button></div><div class="section"><h3>Anotação interna</h3><div class="formgrid">${field(r,'internal',true)}</div></div>`;

 if(tab==='datas')inner=`<div class="timeline">${[['arrival','Chegada'],['notification','Notificação'],['opened','Abertura'],['quoted','Orçamento entregue'],['approved','Decisão'],['shipped','Envio']].map(([k,l])=>`<div class="milestone"><small>${l}</small><b>${date(r[k])||'—'}</b></div>`).join('')}</div><div class="formgrid">${['arrival','notification','opened','budgetForecast','quoted','decision','approved','forecast','shipped'].map(k=>field(r,k)).join('')}</div><div class="metrics">${['ltNotification','ltBudget','ltApproval','age'].map(k=>`<div class="metric"><small>${FM[k][1]}</small><strong>${calc(r,k)===''?'—':calc(r,k)+' dias'}</strong></div>`).join('')}</div><div class="note">Previsões não encerram fases. “Dias desde notificação” continua até a data de referência, como na planilha. Datas fora de sequência ficam visíveis; valores negativos pedem conferência. A decisão deve indicar se houve aprovação ou reprovação.</div>`;
 if(tab==='sap')inner=`<div class="note">Retrato do JSON enviado em 23/10/2026, somente para consulta. Não há consulta online ao SAP/PartsVis nem atualização automática desses valores. Use os números para consultar os sistemas e registre o resultado em Acompanhamento.</div>${r.sap?.length?r.sap.map(s=>`<section class="section"><div class="row"><h3>OS ${esc(s.os)}</h3><button onclick="copyText(${esc(JSON.stringify(s.os))})">Copiar OS</button>${badge(s.stage)}${badge(s.origin,'gray')}</div><table class="sourceTable"><tr><th>Cliente / modelo / série</th><td>${esc(s.client)} · ${esc(s.model)} · ${esc(s.serial)}</td></tr><tr><th>Serviço</th><td>${esc(s.service)}</td></tr><tr><th>Peças no JSON</th><td>${fmtMoney.format(s.parts)}</td></tr>${Object.entries(s.dates||{}).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${date(v)||'—'}</td></tr>`).join('')}</table></section>`).join(''):'<div class="empty">Sem correspondência no JSON de referência. O registro pode continuar sendo acompanhado.</div>'}`;
 if(tab==='history')inner=`<div class="note">Edições ficam neste histórico. Conferir a OS é uma ação explícita; editar uma observação não renova a confirmação.</div><div class="history">${(r.history||[]).map(e=>`<div class="event"><small>${new Date(e.at).toLocaleString('pt-BR')}</small>${esc(e.text)}</div>`).join('')||'<div class="empty">Sem alterações nesta prévia.</div>'}</div>`;
 return `<div class="detail"><div class="detailTitle"><div><div class="eyebrow">${esc(r.site||'Site a informar')} / ${esc(r.type||'Tipo a informar')}</div><h2>${esc(r.component||'Novo componente')}</h2><p>${esc(r.fleet)} · ${esc(r.os||'Ainda sem OS')}</p><p style="font-size:12px">${esc(r.seller||'Vendedor não informado')} · ${esc(r.client||'Cliente não informado')}</p></div>${badge(r.status)}</div><div class="row" style="margin-bottom:16px"><button onclick="copyText(get('${r.id}').os)">Copiar OSs</button><button onclick="copyText(get('${r.id}').order)">Copiar pedido</button><button onclick="copySummary('${r.id}')">Copiar resumo</button><button onclick="showRelated('${r.id}')">Relacionadas</button>${!inModal?'<span class="spacer"></span><button id="undo" onclick="undo()">↶</button><button id="redo" onclick="redo()">↷</button>':''}</div>${tabsHTML}${inner}<div class="hint" style="margin-top:18px">Campos são gravados ao sair deles. Ctrl S baixa/salva o backup de toda a carteira. Rascunho local não sincroniza computadores.</div></div>`}
function refreshDetail(){if(modalRow&&get(modalRow))showDetail(modalRow,true)}
function dialog(title,body,footer='',small=false){$('#modal').innerHTML=`<div class="dialogback"><section class="dialog ${small?'small':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialogheader"><h2>${title}</h2><button aria-label="Fechar" onclick="closeModal()">✕</button></div><div class="dialogbody">${body}</div>${footer?`<div class="dialogfooter">${footer}</div>`:''}</section></div>`}
function closeModal(){document.activeElement?.blur();modalRow=null;$('#modal').innerHTML='';render()}
function showDetail(id,keep=false){if(!get(id))return;if(!keep)modalTab='rotina';modalRow=id;dialog('Ficha do componente',detail(get(id),true));saveStatus()}
function showSelected(){showDetail([...selected][0]||visibleRows[focusCell?.r||0]?.id||active)}
function showRelated(id){let r=get(id),roots=expandOS(r.os).map(x=>x.slice(0,-2));let rs=state.rows.filter(x=>x.id!==id&&expandOS(x.os).some(y=>roots.includes(y.slice(0,-2))));modalRow=null;dialog('OSs relacionadas',`<p>Registros do controle com a mesma raiz de OS. O vínculo é uma sugestão para consulta; valores e campos continuam independentes.</p>${rs.map(x=>`<div class="actionBanner"><b>${esc(x.component)}</b> ${esc(x.os)} <span class="spacer"></span><button onclick="showDetail('${x.id}')">Abrir</button></div>`).join('')||'<div class="empty">Não há outro registro com a mesma raiz de OS.</div>'}`)}
function expandOS(s){return String(s||'').split(/[;,\n]+/).flatMap(chunk=>{let ps=chunk.trim().split('/').map(x=>x.trim()).filter(Boolean);return ps.length?[ps[0],...ps.slice(1).map(x=>x.length<ps[0].length?ps[0].slice(0,-x.length)+x:x)]:[]})}
function parseValue(k,s){s=String(s??'').trim();if(FM[k]?.[3]==='date'){if(!s)return '';if(/^\d{2}\/\d{2}\/\d{4}$/.test(s))s=s.slice(6)+'-'+s.slice(3,5)+'-'+s.slice(0,2);if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||isNaN(Date.parse(s))||new Date(s+'T12:00Z').toISOString().slice(0,10)!==s)throw Error('Data inválida em '+FM[k][1]+'. Use dd/mm/aaaa.');return s}if(FM[k]?.[3]==='money'){if(!s)return '';s=s.replace(/R\$|\s/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');if(!/^-?\d+(\.\d+)?$/.test(s)||!Number.isFinite(Number(s)))throw Error('Valor inválido em '+FM[k][1]);return Number(s)}if(k==='invoiceMonth'&&s&&!/^\d{4}-(0[1-9]|1[0-2])$/.test(s))throw Error('Mês deve estar no formato aaaa-mm.');return s}
function editField(id,k,value){try{let v=parseValue(k,value),r=get(id);if(r[k]===v)return;checkpoint('Editar '+FM[k][1]);let old=r[k];r[k]=v;if(k==='seller'||k==='client')refreshPortfolio();history(r,FM[k][1]+': '+String(old||'vazio')+' → '+String(v||'vazio'));changed('');saveStatus();document.querySelectorAll('[data-live-total]').forEach(el=>{if(el.dataset.liveTotal===id)el.textContent=display(r,'total')||'Sem valor informado'});}catch(e){toast(e.message)}}
function addRow(){let r=emptyRow();r.seller=sellerFilter||'';r.client=clientFilter||'';mutate('Adicionar componente',()=>{let ix=state.rows.findIndex(x=>x.id===( [...selected][0]||active));state.rows.splice(ix+1,0,r);active=r.id;selected=new Set([r.id]);q='';site='';status='';channel='all';scope='active'});if(visual==='grid'){let ix=visibleRows.findIndex(x=>x.id===r.id);focusAt(ix,0);beginEdit(cellAt(ix,0))}else if(MODE==='agenda'||(MODE==='grade'&&visual==='cards'))showDetail(r.id)}
function emptyRow(){return {...Object.fromEntries(F.filter(f=>f[3]!=='calc').map(f=>[f[0],''])),seller:sellerFilter||'',client:clientFilter||'',id:uid(),history:[],archived:false,sap:[],sourceRow:null}}
function setChannel(c){channel=c;render()}
function clearFilters(){q='';site='';status='';channel='all';scope='active';sortKey='';sellerFilter=clientFilter=null;tabSearch='';resetSelection();savePortfolio();render()}
function changeReference(v){if(!v)return;mutate('Mudar data de referência',()=>state.referenceDate=v)}
function sortBy(k){sortDir=sortKey===k?-sortDir:1;sortKey=k;anchor=focusCell=rectEnd=null;render()}
function toggleRow(id,on){on?selected.add(id):selected.delete(id);active=id;render()}
function selectAll(on){visibleRows.forEach(r=>on?selected.add(r.id):selected.delete(r.id));render()}
function targetIds(){return selected.size?[...selected]:focusCell&&visibleRows[focusCell.r]?[visibleRows[focusCell.r].id]:active?[active]:[]}
function archiveRows(){let ids=targetIds();if(!ids.length)return;let ar=scope!=='archive';mutate(ar?'Arquivar registros':'Reativar registros',()=>ids.forEach(id=>get(id).archived=ar),ids);toast(ar?'Arquivados. Use o filtro Arquivados para reativar ou Ctrl Z.':'Registros reativados.');}
function duplicateRows(){let ids=targetIds();if(!ids.length)return;mutate('Duplicar linhas',()=>{let created=[];ids.forEach(id=>{let old=get(id),r=structuredClone(old);r.id=uid();r.history=[];history(r,'Cópia do registro '+(old.os||old.component));state.rows.splice(state.rows.indexOf(old)+1,0,r);created.push(r.id)});selected=new Set(created);active=created[0]});toast('Linhas duplicadas. Revise OSs e documentos para evitar duplicidade.')}
function canMove(){if(sortKey){toast('Escolha “Ordem manual” antes de movimentar linhas.');return false}return true}
function moveRows(dir){if(!canMove())return;let ids=targetIds(),set=new Set(ids);mutate('Mover linhas',()=>{if(dir<0){for(let i=1;i<state.rows.length;i++)if(set.has(state.rows[i].id)&&!set.has(state.rows[i-1].id))[state.rows[i-1],state.rows[i]]=[state.rows[i],state.rows[i-1]]}else for(let i=state.rows.length-2;i>=0;i--)if(set.has(state.rows[i].id)&&!set.has(state.rows[i+1].id))[state.rows[i],state.rows[i+1]]=[state.rows[i+1],state.rows[i]]});}
function moveTo(ids,before){if(!canMove()||ids.includes(before))return;mutate('Mover linhas por arraste',()=>{let set=new Set(ids),moving=state.rows.filter(r=>set.has(r.id));state.rows=state.rows.filter(r=>!set.has(r.id));let ix=state.rows.findIndex(r=>r.id===before);state.rows.splice(ix<0?state.rows.length:ix,0,...moving)});}
function bindDrag(){document.querySelectorAll('[data-drag]').forEach(el=>{el.ondragstart=e=>{if(e.target.matches('input,textarea,select')){e.preventDefault();return}let id=el.dataset.drag;dragRows=selected.has(id)?[...selected]:[id];e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragRows.join(','))};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();e.stopPropagation();if(dragRows)moveTo(dragRows,el.dataset.drag);dragRows=null}});document.querySelectorAll('[data-lane]').forEach(el=>{el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();if(!dragRows)return;let ids=dragRows;if(el.dataset.lane==='none'&&ids.some(id=>get(id).actionDue)){toast('Este registro possui prazo de ação. Limpe o prazo na ficha se quiser deixá-lo sem agenda.');dragRows=null;return}let v=el.dataset.lane==='now'?state.referenceDate:el.dataset.lane==='later'?plusDay(state.referenceDate,1):'';mutate('Reagendar verificação',()=>ids.forEach(id=>get(id).reviewDate=v),ids);dragRows=null;toast('Próxima verificação atualizada. O prazo da ação foi preservado.')};el.querySelectorAll('[data-drag]').forEach(x=>x.ondrop=null)})}
function plusDay(d,n){let x=new Date(d+'T12:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}

function parseTSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'&&(quoted||cell==='')){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(!quoted&&(c==='\t'||c==='\n'||c==='\r')){row.push(cell);cell='';if(c!=='\t'){rows.push(row);row=[];if(c==='\r'&&text[i+1]==='\n')i++}}else cell+=c}if(cell!==''||row.length) {row.push(cell);rows.push(row)}return rows}

function importPaste(){modalRow=null;dialog('Colar tabela do Excel',`<p>Cole um bloco do Excel. Com cabeçalhos, os nomes da planilha original e deste painel são reconhecidos. Sem cabeçalho, será usada a ordem de colunas da visão <b>${esc(view)}</b>.</p><textarea id="pasteBox" style="width:100%;height:220px" placeholder="Ctrl V aqui"></textarea><div class="row" style="margin-top:10px"><label><input type="checkbox" id="pasteHeaders" checked> A primeira linha contém cabeçalhos</label></div><p class="muted">Importação adiciona linhas, sem substituir as existentes. Valores calculados serão refeitos. Revise possíveis OSs duplicadas.</p>`,`<button onclick="closeModal()">Cancelar</button><button class="primary" onclick="applyImportPaste()">Adicionar linhas</button>`)}
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const aliases={'componente':'component','frota':'fleet','requisicao':'requisition','nf':'nf','pedido':'order','ossotreq':'os','tipo':'type','status':'status','pecas':'parts','servicosdiversos':'services','total':'total','observacaopecas':'piecesNote','observacaoadcional':'note','observacaoadicional':'note','datachegada':'arrival','datanotificacao':'notification','dataaberturaos':'opened','entregaorcamento':'quoted','dataaprovacaoreprovacao':'approved','dataenvio':'shipped','leadtimenotificacao':'ltNotification','slaorcamento':'ltBudget','leadtimeaprovacao':'ltApproval','prazoemaberto':'age','site':'site','responsavelcomercial':'seller','nomevendedor':'seller','nomecliente':'client',...Object.fromEntries(F.map(([k,l])=>[norm(l),k]))};

function cellAt(r,c){return document.querySelector(`td.cell[data-r="${r}"][data-c="${c}"]`)}
function focusAt(r,c,extend=false){r=Math.max(0,Math.min(visibleRows.length-1,r));c=Math.max(0,Math.min(cols.length-1,c));if(r<0)return;focusCell={r,c};if(!extend||!anchor)anchor={r,c};rectEnd={r,c};let el=cellAt(r,c);el?.focus();el?.scrollIntoView({block:'nearest',inline:'nearest'});paintSelection()}

function bindGrid(){document.querySelectorAll('[data-rownum]').forEach(el=>{el.onclick=e=>{let i=+el.dataset.rownum,id=visibleRows[i].id;if(e.shiftKey&&selected.size){let a=visibleRows.findIndex(r=>selected.has(r.id));for(let x=Math.min(a,i);x<=Math.max(a,i);x++)selected.add(visibleRows[x].id)}else if(e.ctrlKey||e.metaKey){selected.has(id)?selected.delete(id):selected.add(id)}else selected=new Set([id]);active=id;anchor=focusCell=rectEnd=null;render()};el.ondblclick=()=>showDetail(visibleRows[+el.dataset.rownum].id)});$$('td.cell').forEach(el=>{el.onclick=e=>{if(el.isContentEditable)return;if(!e.shiftKey)selected.clear();active=el.dataset.id;focusAt(+el.dataset.r,+el.dataset.c,e.shiftKey)};el.ondblclick=()=>beginEdit(el);el.onkeydown=cellKey});}
function beginEdit(el,initial){if(!el||FM[el.dataset.key][3]==='calc')return toast('Campo calculado. Edite as datas ou valores de origem.');el.dataset.old=el.textContent;el.contentEditable='true';el.textContent=initial??String(display(get(el.dataset.id),el.dataset.key));el.focus();let range=document.createRange();range.selectNodeContents(el);let sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);if(initial!==undefined)sel.collapseToEnd();el.onblur=()=>commitEdit(el)}

async function saveFile(){document.activeElement?.blur();let exported=new Date().toISOString(),payload=JSON.stringify({...state,exportedAt:exported},null,2),name='Controle_Planejador_'+MODE+'_'+localToday()+'.json';try{if(window.showSaveFilePicker){if(!fileHandle)fileHandle=await showSaveFilePicker({suggestedName:name,types:[{description:'Controle do planejador',accept:{'application/json':['.json']}}]});let writable=await fileHandle.createWritable();await writable.write(payload);await writable.close();toast('Backup salvo no arquivo escolhido.')}else {download(name,payload,'application/json');toast('Backup gerado para download. Guarde o JSON junto do HTML.')}state.exportedAt=exported;dirty=false;persist()}catch(e){if(e.name==='AbortError')return;download(name,payload,'application/json');toast('Não foi possível gravar direto. Backup gerado para download.');state.exportedAt=exported;dirty=false;persist()}}

function validateState(s){if(s?.schema!=='planejador-experimentos'||s.version!==1||!Array.isArray(s.rows))throw Error('Escolha um backup Controle_Planejador gerado por uma destas três versões. O JSON gerencial atual tem outro formato e não será alterado.');let ids=new Set();s.rows.forEach((r,i)=>{if(typeof r.id!=='string'||!/^[\w-]+$/.test(r.id)||ids.has(r.id))throw Error('Identificação inválida ou repetida na linha '+(i+1));ids.add(r.id);let original=SEED.find(x=>x.id===r.id);for(const k of ['seller','client'])if(r[k]===undefined)r[k]=original?.[k]||'';F.filter(f=>f[3]!=='calc').forEach(([k])=>{if(r[k]!==undefined)r[k]=parseValue(k,r[k]);else r[k]=''});if(!Array.isArray(r.history)||!Array.isArray(r.sap))throw Error('Estrutura de histórico/referência inválida.');r.archived=!!r.archived});parseValue('reviewDate',s.referenceDate);return s}
async function loadFile(e){let f=e.target.files[0];if(!f)return;try{let s=validateState(JSON.parse(await f.text()));pickPending=s;modalRow=null;dialog('Abrir controle',`<p><b>${esc(f.name)}</b></p><p>${s.rows.length} registros · referência ${date(s.referenceDate)}.</p><p>${dirty?'Há alterações sem backup no controle aberto. Salve antes de substituir, se quiser preservá-las.':'O controle do arquivo substituirá a carteira exibida.'}</p>`,`<button onclick="closeModal()">Cancelar</button>${dirty?'<button onclick="saveFile()">Salvar controle atual</button>':''}<button class="primary" onclick="applyOpen()">Abrir este arquivo</button>`,true)}catch(err){toast(err.message)}}

function help(){modalRow=null;dialog('Como usar '+C.title,`<div class="note"><b>Prévia funcional para avaliação.</b> Os 48 atendimentos fictícios vieram da planilha enviada. As referências SAP e alguns campos operacionais vieram do JSON de 23/10/2026. Cada HTML tem rascunho próprio; use o backup JSON para transportar os mesmos dados entre as três versões.</div><div class="note"><b>Carteiras como abas.</b> Os nomes vêm das colunas Vendedor e Cliente. Escolha um vendedor e depois um cliente; a grade e os cards mostram a mesma seleção. As contagens das abas consideram a carteira ativa/arquivada, sem reduzir a lista pela busca textual. “Toda a carteira” limpa apenas essas duas seleções. “Limpar filtros” limpa tudo. Use Exemplos para testar os 48 atendimentos fictícios Cliente Demonstração ou 18 atendimentos fictícios da carteira multivendedor.</div><div class="helpgrid"><article><h3>01 · Abrir e retomar</h3><p>Abra este HTML no Edge ou Chrome. Ao voltar, o rascunho deste navegador é retomado. “Abrir controle” carrega um backup JSON destas versões. Limpeza de dados do navegador ou mudança de computador pode remover o rascunho.</p></article><article><h3>02 · Editar como uma tabela</h3><p>Duplo clique ou F2 edita a célula. Enter confirma e desce; Tab vai para a direita. Clique e Shift + clique selecionam um bloco. Setas com Shift também ampliam a seleção.</p><p><kbd>Ctrl C</kbd> <kbd>Ctrl V</kbd> copiam e colam blocos com Excel, inclusive textos com quebras de linha. Uma célula colada sobre um bloco preenche todo o bloco.</p></article><article><h3>03 · Linhas e movimentação</h3><p>Clique no número da linha; Ctrl + clique seleciona várias e Shift seleciona intervalo. Arraste o número ou use Alt + ↑/↓. Ctrl C/X/V nas linhas selecionadas ou os botões Copiar/Recortar/Colar linhas mantêm todos os campos, mesmo os ocultos. Ao colar no Excel, os atalhos levam as colunas da visão atual.</p><p>Movimentação usa a ordem completa da carteira. Com filtros, registros ocultos também ocupam posições. Para arrastar, use a ordem manual.</p></article><article><h3>04 · Menos preenchimento repetido</h3><p>“Editar em lote” aplica um campo à seleção. Ctrl D preenche abaixo com a primeira linha do bloco. Arquivar tira o registro da carteira ativa; reative no filtro Arquivados. Ctrl Z/Y desfaz/refaz até 50 operações da sessão.</p></article><article><h3>05 · Salvar e fechar</h3><p>Ctrl S ou “Salvar backup” salva um JSON. Quando o navegador permitir, escolha um arquivo e os próximos salvamentos atualizam essa cópia. Caso contrário, será baixado um novo arquivo.</p><p>O aviso superior indica alterações sem backup. Ao fechar, o navegador pode pedir confirmação. O rascunho e o backup são independentes.</p></article><article><h3>06 · SAP, PartsVis e compartilhamento</h3><p>Use “Copiar OSs” e “Copiar pedido” para consultar os sistemas. A referência SAP é uma fotografia, sem acesso online. Registre o resultado e a próxima verificação.</p><p>Estes JSONs ainda não são respostas importáveis no painel gerencial atual. A integração será feita após escolhermos o modelo. Não há sincronização simultânea entre usuários.</p></article></div><div class="section"><h3>Datas e rotina</h3><p>A referência começa em 23/10/2026 para comparar os mesmos exemplos. Altere no topo para o dia desejado. Editar dados não confirma a OS automaticamente. “Conferido” registra a confirmação explicitamente; concluir uma ação guarda o texto no histórico e libera o campo para a próxima.</p></div><button onclick="resetDemo()">Recomeçar avaliação com os dados originais</button>`)}

function osSort(a,b){return String(a.number).localeCompare(String(b.number),'pt-BR',{numeric:true})}
function children(r){return (r.children||[]).filter(c=>scope==='quarantine'?!!c.quarantineAt:!c.quarantineAt).sort(osSort)}
function primary(r,k){const cs=children(r);return cs.find(c=>c.number===r.primary?.[k])||cs[0]}
function compactOS(cs){const ns=cs.map(c=>c.number).filter(Boolean);return ns.map((n,i)=>i&&n.slice(0,-2)===ns[0].slice(0,-2)?n.slice(-2):n).join('/')}
function orderText(c){return (c?.orders||[]).map(o=>[o.pedido,date(o.due),o.note].filter(Boolean).join(' · ')).join('\n')}
function childValue(c,k){if(!c)return '';if(k==='order')return c.orders.map(o=>o.pedido).filter(Boolean).join(' / ');if(k==='piecesNote')return orderText(c);return c.values[k]??''}
function normalizeRow(r){if(r._ready)return r;
 if(!Array.isArray(r.children)){let nums=[...new Set(expandOS(r.os))];if(!nums.length)nums=[''];const vals=Object.fromEntries(F.filter(f=>!sharedKeys.has(f[0])&&f[3]!=='calc').map(([k])=>[k,r[k]??'']));r.children=nums.map((number,i)=>({number,values:i===0?{...vals}:{},orders:i===0&&(r.order||r.piecesNote)?[{id:uid(),pedido:String(r.order||''),due:'',note:String(r.piecesNote||'')}]:[],quarantineAt:'',history:[]}));if(nums.length>1)r.migrationNote='Dados anteriores preservados na OS '+nums[0]+'. As demais estão disponíveis para revisão e replicação explícita.';if(r.decision)r.legacyDecision=r.decision;}
 r.primary=r.primary||{};r.children.sort(osSort);r.children.forEach(c=>{c.values=c.values||{};c.orders=c.orders||[];c.history=c.history||[]});
 Object.defineProperty(r,'_ready',{value:true,configurable:true});
 for(const [k,, ,t] of F){if(sharedKeys.has(k)||t==='calc')continue;Object.defineProperty(r,k,{enumerable:true,configurable:true,get(){return childValue(primary(r,k),k)},set(v){let c=primary(r,k);if(c)setChild(r,c,k,v)}})}
 Object.defineProperty(r,'os',{enumerable:true,configurable:true,get(){return compactOS(children(r))},set(v){const nums=[...new Set(expandOS(v))];if(nums.some(n=>!/^[0-9]+$/.test(n)))throw Error('Informe somente números de OS, separados por / ou ;.');const old=children(r),removed=old.filter(c=>!nums.includes(c.number));if(removed.some(c=>c.number)&&!confirm('Remover o vínculo de '+removed.map(c=>c.number).join(', ')+' e seus dados desta linha? Você pode desfazer.'))return;const keep=r.children.filter(c=>!old.includes(c));r.children=[...keep,...(nums.length?nums:['']).map(number=>old.find(c=>c.number===number)||(old.length===1&&!old[0].number&&number===nums[0]?Object.assign(old[0],{number}):{number,values:{},orders:[],history:[],quarantineAt:''}))].sort(osSort);}});return r;}
function setChild(r,c,k,v){if(k==='status'&&v==='Reprovado'&&!c.quarantineAt){if(!confirm('OS '+(c.number||'sem número')+' será removida do acompanhamento e enviada à quarentena por 50 dias. Será possível restaurá-la. Confirmar?'))return false;c.quarantineAt=localToday();}
 if(k==='order'){const nums=String(v).split(/[\/;\n]+/).map(x=>x.trim()).filter(Boolean);c.orders=nums.map((pedido,i)=>c.orders.find(o=>o.pedido===pedido)||{...(c.orders[i]||{id:uid(),due:'',note:''}),pedido});}
 else if(k==='piecesNote'){if(!c.orders.length)c.orders.push({id:uid(),pedido:'',due:'',note:''});c.orders[0].note=v;}
 else c.values[k]=v;c.history.unshift({at:new Date().toISOString(),text:k+' atualizado: '+v});return true;}
function setup(){state.modelVersion=2;state.customFields=state.customFields||[];state.routines=state.routines||{};state.catalogs=state.catalogs||{};state.phaseMap=state.phaseMap||{'Notificação':0,'Orçamento':1,'Negociação':2,'Aprovado':3,'Pronto':4,'DVO':5,'Enviado':5,'Encerrado':5};state.customFields.forEach(f=>{if(!FM[f[0]]){F.push(f);FM[f[0]]=f}});Object.assign(VIEWS,state.routines);if(!VIEWS[view])view='rotina';state.rows.forEach(normalizeRow);}
parseValue=function(k,s){s=String(s??'').trim();if(FM[k]?.[3]==='date'){if(/^\d{6}$/.test(s))s=s.slice(0,2)+'/'+s.slice(2,4)+'/'+s.slice(4);if(/^\d{2}\/\d{2}\/\d{2}$/.test(s))s=s.slice(0,6)+'20'+s.slice(6);}return originalParse(k,s)};
date=function(v){return /^\d{4}-\d{2}-\d{2}$/.test(v||'')?v.slice(8)+'/'+v.slice(5,7)+'/'+v.slice(2,4):v||''};
validateState=function(s){if(s?.modelVersion===2){if(s.schema!=='planejador-experimentos'||!Array.isArray(s.rows))throw Error('Backup inválido');let ids=new Set();for(const r of s.rows){if(!/^[\w-]+$/.test(r.id)||ids.has(r.id)||!Array.isArray(r.children))throw Error('Linha inválida no backup');ids.add(r.id);let nums=new Set();for(const c of r.children){if(typeof c.number!=='string'||!/^\d*$/.test(c.number)||nums.has(c.number)||!c.values||!Array.isArray(c.orders))throw Error('Matriz de OS inválida');nums.add(c.number);for(const [k,v] of Object.entries(c.values))if(FM[k])parseValue(k,v);for(const o of c.orders)parseValue('forecast',o.due||'');if(c.quarantineAt)parseValue('forecast',c.quarantineAt);}}return s}return originalValidate(s)};

function inputHTML(r,k,c=null){const number=c?.number,curr=c?childValue(c,k):r[k],target=c?`matrixEdit('${r.id}',${esc(JSON.stringify(number))},'${k}',this.value)`:`editField('${r.id}','${k}',this.value)`;if(k==='piecesNote'||k==='order')return `<button class="cellPart" onclick="ordersDialog('${r.id}',${esc(JSON.stringify((c||primary(r,k))?.number||''))})">${esc(curr||'＋ Pedido / previsão / nota')}</button>`;let h=`<input aria-label="${esc(FM[k][1])}" list="suggest-${k}" value="${esc(FM[k][3]==='date'?date(curr):curr)}" placeholder="${k==='confirmed'?date(localToday()):FM[k][3]==='date'?'dd/mm/aa':''}" onchange="${target}">`;if(FM[k][3]==='date')h+=`<input class="datePicker" aria-label="Calendário ${esc(FM[k][1])}" type="date" value="${esc(curr)}" onchange="${target}">`;if(k==='confirmed')h+=`<button class="tiny" onclick="${c?`matrixEdit('${r.id}',${esc(JSON.stringify(number))},'confirmed',localToday())`:`confirmRow('${r.id}')`}">✓ Hoje</button>`;return `<div class="inlineField">${h}</div>`}

function cellDecoration(r,k){const cs=children(r),c=primary(r,k),diff=!sharedKeys.has(k)&&new Set(cs.map(x=>String(childValue(x,k)))).size>1;return `${k==='os'?`<button class="tiny" onclick="event.stopPropagation();expanded.has('${r.id}')?expanded.delete('${r.id}'):expanded.add('${r.id}');render()">${expanded.has(r.id)?'−':'＋'} Matriz</button>`:''}${k==='confirmed'?`<span class="ghost">${r.confirmed?'':date(localToday())}</span><button class="tiny" onclick="event.stopPropagation();confirmRow('${r.id}')">✓ Hoje</button>`:''}${diff?`<button class="diff" title="Valor exibido: OS ${esc(c?.number)}. Ver outras OSs ou mudar principal." onclick="event.stopPropagation();summaryDialog('${r.id}','${k}')">≠ ${esc(c?.number.slice(-2))}</button>`:''}${scope==='quarantine'&&k==='os'?`<small>${cs.map(c=>esc(c.number.slice(-2))+': '+Math.max(0,50-days(c.quarantineAt,localToday()))+' dias restantes').join(' · ')}</small><button class="tiny" onclick="event.stopPropagation();restoreDialog('${r.id}')">Restaurar</button>`:''}`}
grid=function(){let h=originalGrid();h=h.replace(/(<td tabindex="0"[^>]*data-id="([^"]+)" data-key="([^"]+)"[^>]*>)([\s\S]*?)(<\/td>)/g,(_,a,id,k,b,z)=>a+`<span class="cellValue">${b}</span>`+cellDecoration(get(id),k)+z);for(const r of visibleRows)if(expanded.has(r.id)){const marker=`<tr data-id="${r.id}"`;const start=h.indexOf(marker),end=h.indexOf('</tr>',start)+5;h=h.slice(0,end)+`<tr class="matrixRow"><td colspan="${cols.length+1}">${matrixHTML(r)}</td></tr>`+h.slice(end)}return h};

help=function(){modalRow=null;dialog('Como trabalhar na mesa de planejamento',`<div class="helpgrid"><article><h3>Abrir e guardar</h3><p>Abra este HTML no Edge ou Chrome. O rascunho é retomado neste navegador. Use Abrir controle para carregar seu backup JSON.</p><p><b>Ctrl S</b> salva o backup com os dados, matrizes, pedidos, rotinas e sugestões. O aviso “Backup pendente” indica alterações que ainda precisam ser guardadas em arquivo.</p></article><article><h3>Preencher a grade</h3><p>Um clique inicia a edição. Você também pode selecionar uma célula com as setas e começar a digitar, usar F2 ou dar duplo clique. Enter confirma e desce; Tab confirma e vai à direita; Esc cancela a edição.</p><p>As sugestões aparecem enquanto você digita. Use ↑/↓ e Enter para escolher ou continue com seu texto. A seta da célula abre a lista diretamente. Datas aceitam dd/mm/aa ou ddmmaa; o calendário está sempre acessível.</p></article><article><h3>Selecionar e trabalhar em bloco</h3><p>Shift + clique ou Shift + setas ampliam a seleção. Você também pode arrastar sobre as células. Ctrl C/V copia e cola blocos com o Excel. Clique nos números das linhas para selecionar registros completos; Ctrl + clique combina linhas.</p><p>O botão Em lote e o botão direito reconhecem a coluna da primeira célula selecionada. Confira o alcance mostrado antes de aplicar. Ctrl Z/Y desfaz/refaz as operações.</p></article><article><h3>OSs e pedidos</h3><p>Clique em OSs vinculadas para digitar a OS completa e as terminações: 800000001/02/03. ＋ Matriz expande os dados independentes por OS. O botão ≠ mostra divergências e permite escolher qual OS aparece em cada coluna.</p><p>Replicar campos exige confirmação. Situação Peças e Pedido usam o mesmo cadastro de pedidos, cada um com sua previsão e observação. O balão permite adicionar ou remover pedidos sem sair da carteira.</p></article><article><h3>Confirmar e acompanhar</h3><p>✓ Hoje confirma somente a OS principal do campo. Alterar informações não renova essa data. Na matriz, cada OS tem seu próprio botão de confirmação.</p><p>Grade, cards, fases e calendário respeitam vendedor, cliente e filtros. Arrastar cards não muda Status. O calendário apresenta o mês atual e o próximo por rolagem.</p></article><article><h3>Organizar a tela</h3><p>Vendedor e Cliente funcionam como abas de carteira. Rotinas define as colunas visíveis e sua ordem, incluindo colunas novas. Sugestões recebe a base de clientes e outros cadastros em texto, CSV ou TSV.</p><p>O botão de expansão no canto da tabela amplia a área de trabalho. Use o mesmo botão ou Esc para voltar. Fichas e balões continuam acessíveis nesse modo.</p></article><article><h3>Reprovação, arquivo e exclusão</h3><p>Status Reprovado pede confirmação e envia as OSs indicadas à quarentena. Use o filtro de quarentena para consultar e restaurar. Os 50 dias contam a partir da entrada; dados vencidos ficam preservados.</p><p>Arquivar, reprovar e excluir são operações distintas. Exclusão pode ser desfeita durante a sessão. Guarde um backup para preservar seu controle.</p></article><article><h3>Consultar os sistemas</h3><p>A referência SAP é uma fotografia dos arquivos enviados. Consulte SAP e PartsVis para verificar a situação atual e registre o resultado no acompanhamento.</p><p>O controle funciona no navegador, sem sincronização simultânea entre pessoas. Use backups JSON para transportar os dados entre computadores.</p></article></div>`)};

// A revisão identifica o conteúdo conferido; navegar e mudar a OS principal não o altera.
function contentSnapshot(r,c){return JSON.stringify({shared:Object.fromEntries([...sharedKeys].filter(k=>k!=='os').sort().map(k=>[k,r[k]??''])),values:Object.fromEntries(Object.entries(c.values).filter(([k])=>k!=='confirmed').sort(([a],[b])=>a.localeCompare(b))),orders:c.orders.map(({pedido,due,note})=>({pedido,due,note})),quarantineAt:c.quarantineAt||''})}

function confirmationState(r,c){if(!c?.values.confirmed)return 'Sem confirmação';if(!c.confirmation)return 'Confirmação anterior · conteúdo não registrado';return c.confirmation.snapshot===contentSnapshot(r,c)?'Conferido · '+c.confirmation.by:'Alterado após confirmação'}

const plannerDetail=detail;detail=function(r,m){const c=currentDetailChild(r);if(!c)return plannerDetail(r,m);const p=childProjection(r,c);return `<div class="contextOS"><b>Editando OS ${esc(c.number||'sem número')}</b><span>${esc(confirmationState(r,c))} · revisão ${c.revision||0}</span><button onclick="openGroup('${r.id}')">Visão do grupo</button><button onclick="matrixDialog('${r.id}')">Matriz</button></div>`+originalDetail(p,m).replace(`copyText(get('${r.id}').os)`,`copyText(${esc(JSON.stringify(c.number))})`).replace(`copyText(get('${r.id}').order)`,`copyText(${esc(JSON.stringify(childValue(c,'order')))})`).replace(`copySummary('${r.id}')`,`copyChildSummary('${r.id}',${esc(JSON.stringify(c.number))})`)};

matrixEdit=function(id,number,k,value){try{const r=get(id),c=r.children.find(c=>c.number===number),v=parseValue(k,value);if(!c)return;if(k!=='confirmed'&&String(childValue(c,k))===String(v))return;checkpoint('Editar OS '+number);if(setChild(r,c,k,v)===false){undoStack.pop();return}changed('OS '+number+' · '+FM[k][1],[id]);if(k==='status'){render();if(v==='Reprovado')closeModal();else refreshDetail()}else refreshGridRow(id);if(k==='confirmed')refreshDetail()}catch(e){toast(e.message)}};
const plannerDecoration=cellDecoration;cellDecoration=function(r,k){let h=plannerDecoration(r,k);if(k==='confirmed'){const c=primary(r,k),label=confirmationState(r,c);h+=`<small class="confirmationHint ${label==='Alterado após confirmação'?'changedSince':''}" title="${esc(label+(c?.confirmation?' · '+new Date(c.confirmation.at).toLocaleString('pt-BR')+' · revisão '+c.confirmation.revision:''))}">${label==='Alterado após confirmação'?'Alterado':c?.confirmation?'Conferido':c?.values.confirmed?'Anterior':''}</small>`}if(k==='os'&&(q||status||channel!=='all'))h+=`<small class="matchedOS" title="OSs que atendem a todos os filtros">Filtro: ${esc(compactOS(scopedChildren(r)))}</small>`;return h};

replicateApply=function(id){const r=get(id),source=$('#repSource').value,k=$('#repKey').value,targets=$$('.repTarget input:checked').map(e=>e.value).filter(n=>n!==source),keys=(k==='*'?F.filter(f=>!sharedKeys.has(f[0])&&f[3]!=='calc'&&f[0]!=='order').map(f=>f[0]):[k]).filter(k=>k!=='confirmed');if(!targets.length||!keys.length)return toast('Escolha campos e OSs de destino.');if(!confirm('OS origem: '+source+'\nDestinos: '+targets.join(', ')+'\nSobrescrever: '+keys.map(k=>FM[k][1]).join(', ')+'\nA confirmação anterior não será copiada. Confirmar?'))return;mutate('Replicar da OS '+source,()=>{const src=r.children.find(c=>c.number===source);for(const c of r.children.filter(c=>targets.includes(c.number))){for(const key of keys){if(key==='piecesNote')c.orders=structuredClone(src.orders).map(o=>({...o,id:uid()}));else c.values[key]=structuredClone(childValue(src,key))}c.history.unshift({at:new Date().toISOString(),text:'Campos replicados da OS '+source})}},[id]);closeModal()};
function confirmMatrix(id){const r=get(id),ns=$$(`.matrix[data-group="${id}"] input[data-confirm-os]:checked`).map(el=>el.dataset.confirmOs);if(!ns.length)return toast('Marque as OSs a conferir na matriz.');mutate('Conferência de '+ns.length+' OSs da matriz',()=>r.children.filter(c=>ns.includes(c.number)).forEach(c=>stampConfirmation(r,c,localToday())),[id]);render();if($('#modal').innerHTML)matrixDialog(id)}
matrixHTML=function(r){const keys=cols.filter(k=>!sharedKeys.has(k)&&FM[k][3]!=='calc');return `<div class="matrix" data-group="${r.id}"><div class="row"><b>Matriz · OSs em ordem crescente</b><button onclick="replicateDialog('${r.id}')">Replicar campos</button><button onclick="confirmMatrix('${r.id}')">✓ Conferir marcadas</button><button onclick="osDialog('${r.id}')">Vincular OSs</button><small>Marque as OSs para conferir; cada campo edita somente a OS da sua linha.</small></div><table><colgroup><col style="width:155px">${keys.map(k=>`<col style="width:${Math.max(FM[k][2],200)}px">`).join('')}</colgroup><thead><tr><th>OS / conferência</th>${keys.map(k=>`<th>${esc(FM[k][1])}</th>`).join('')}</tr></thead><tbody>${children(r).map(c=>`<tr><th><label><input type="checkbox" data-confirm-os="${esc(c.number)}"> ${esc(c.number||'Sem OS')}</label><small title="${esc(confirmationState(r,c))}">${esc(confirmationState(r,c))}</small><button onclick="showDetail('${r.id}',false,${esc(JSON.stringify(c.number))})">Abrir OS ↗</button></th>${keys.map(k=>`<td>${inputHTML(r,k,c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`};

littleCard=function(r,c=null){const cs=scopedChildren(r);c=c||cs[0]||children(r)[0];if(!c)return '';const val=k=>childValue(c,k),n=JSON.stringify(c.number),p=phaseIndex(val('status'));return `<article class="miniCard" tabindex="0" role="button" aria-label="Abrir OS ${esc(c.number)} · ${esc(r.component)}" draggable="${visual==='phases'}" data-drag="${r.id}" data-os="${esc(c.number)}" data-phase="${p}" onclick="showDetail('${r.id}',false,${esc(n)})" onkeydown="if(event.target===this&&(event.key==='Enter'||event.key===' ')){event.preventDefault();showDetail('${r.id}',false,${esc(n)})}"><div><b title="${esc(r.component)}">${esc(r.component||'Novo componente')}</b><span>${esc(c.number)}${visual==='cards'&&cs.length>1?' · +'+(cs.length-1)+' OSs':''}</span></div><small title="${esc(r.client)}">${esc(r.client||'Cliente a informar')} · ${esc(val('status')||'Sem status / A definir')}</small><p title="${esc(val('situation'))}">${esc(val('situation')||'Situação a informar')}</p><p class="cardAction" title="${esc(val('nextAction'))}">${esc(val('nextAction')||'Definir próxima ação')}</p><div class="cardMeta"><span title="${esc(val('owner'))}">${esc(val('owner')||'Sem responsável')}</span><small title="Prazo da ação">${date(val('actionDue'))||'Sem prazo de ação'}</small></div>${visual==='phases'?`<div class="cardMove"><button title="Mover OS acima na fase" onclick="event.stopPropagation();movePhaseStep('${r.id}',${esc(n)},-1)">↑</button><button title="Mover OS abaixo na fase" onclick="event.stopPropagation();movePhaseStep('${r.id}',${esc(n)},1)">↓</button><small>⋮⋮ arraste nesta fase</small></div>`:''}</article>`};

function reorderPhase(source,target,p){if(!source||source===target)return;const ids=phaseItems(p);if(!ids.includes(source)||!ids.includes(target))return toast('Mova a OS somente dentro da mesma fase.');ids.splice(ids.indexOf(source),1);ids.splice(ids.indexOf(target),0,source);mutate('Ordenar OSs na fase',()=>{state.phaseOrder=[...ids,...(state.phaseOrder||[]).filter(id=>!ids.includes(id))]})}

function bindPhaseDrag(){$$('.miniCard').forEach(el=>{el.ondragstart=e=>{if(visual!=='phases'||e.target.closest('button'))return e.preventDefault();phaseDrag={key:el.dataset.drag+':'+el.dataset.os,phase:+el.dataset.phase};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',phaseDrag.key);el.classList.add('dragging')};el.ondragend=()=>{phaseDrag=null;$$('.dropTarget,.dragging').forEach(x=>x.classList.remove('dropTarget','dragging'))};el.ondragover=e=>{if(phaseDrag&&phaseDrag.phase===+el.dataset.phase){e.preventDefault();el.classList.add('dropTarget')}};el.ondragleave=()=>el.classList.remove('dropTarget');el.ondrop=e=>{e.preventDefault();e.stopPropagation();if(phaseDrag&&phaseDrag.phase===+el.dataset.phase)reorderPhase(phaseDrag.key,el.dataset.drag+':'+el.dataset.os,phaseDrag.phase);else toast('Arrastar não altera a fase. Edite Status para isso.');phaseDrag=null}})}

function applyTableLayout(){const table=$('table.sheet');if(!table)return;const prefs=layoutPrefs();table.style.width=(45+cols.reduce((n,k)=>n+FM[k][2],0))+'px';let left=45;for(const k of ['component','os']){if(!cols.includes(k)||!prefs.freeze)continue;document.querySelectorAll(`.sheet [data-key="${k}"],.sheet th[data-column="${k}"]`).forEach(el=>{el.classList.add('frozenColumn');el.style.left=left+'px'});left+=FM[k][2]}$$('[data-resize]').forEach(el=>{const k=el.dataset.resize;el.onpointerdown=e=>{if(!flushEditor())return;e.preventDefault();e.stopPropagation();const x=e.clientX,start=FM[k][2],col=table.querySelectorAll('col')[cols.indexOf(k)+1];el.setPointerCapture(e.pointerId);el.onpointermove=ev=>{const w=Math.max(90,Math.min(720,start+ev.clientX-x));FM[k][2]=w;prefs.widths[k]=w;if(col)col.style.width=w+'px';el.parentElement.style.width=w+'px';table.style.width=(45+cols.reduce((n,c)=>n+FM[c][2],0))+'px'};el.onpointerup=()=>{el.onpointermove=el.onpointerup=null;savePortfolio();render()}};el.onkeydown=e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();e.stopPropagation();prefs.widths[k]=Math.max(90,Math.min(720,FM[k][2]+(e.key==='ArrowRight'?20:-20)));savePortfolio();render()}})}

const plannerRender=render;render=function(){setup();const signature=JSON.stringify([q,site,status,channel,scope,sellerFilter,clientFilter,view,visual,sortKey,sortDir,filtered().map(r=>r.id)]);if(selectionScope&&selectionScope!==signature)resetSelection();selectionScope=signature;const ids=new Set(filtered().map(r=>r.id));selected=new Set([...selected].filter(id=>ids.has(id)));if(!ids.has(active))active=filtered()[0]?.id||null;const widths=layoutPrefs().widths;F.forEach(f=>f[2]=widths[f[0]]||defaultWidths[f[0]]||f[2]);plannerRender();document.body.classList.toggle('densityComfortable',uiPrefs().density==='comfortable');applyTableLayout();bindPhaseDrag();savePortfolio();};

const plannerHelp=help;help=function(){plannerHelp();$('.dialogbody')?.insertAdjacentHTML('afterbegin',`<div class="note"><b>Grade mais próxima do Excel</b><p>Ajuste as larguras arrastando a borda dos cabeçalhos. Compacta/Confortável muda a altura das linhas. Fixadas mantém Componente e OSs visíveis. Essas preferências, a rotina e a visão são retomadas no navegador e no backup.</p><p>Filtros verificam todas as OSs filhas. A grade preserva os principais por coluna e indica quais OSs atenderam ao filtro; cards, fases e calendário mostram as filhas correspondentes. Ao abrir um card, a ficha permanece naquela OS.</p><p>Identifique o planejador na barra superior antes de conferir. A data da última confirmação fica preservada; “Alterado” sinaliza mudanças posteriores. O nome informado é identificação local, sem autenticação. A matriz permite conferir várias OSs marcadas. Replicar não copia a confirmação.</p><p>Arraste cards somente dentro da fase ou use ↑/↓. “Sem status / A definir” recebe OSs sem fase cadastrada. Alterações de filtro, carteira ou ordem limpam a seleção para evitar edições em linhas ocultas.</p></div>`)};
