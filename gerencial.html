<script>/* Regras independentes da interface. Não realiza I/O nem envio. */
(function(root){

const clone=x=>JSON.parse(JSON.stringify(x));

function iso(x){

 if(typeof x==='number' && Number.isFinite(x)) return new Date(Date.UTC(1899,11,30)+Math.round(x)*86400000).toISOString().slice(0,10);
 let s=String(x??'').trim(); if(!s)return '';

}
function monthISO(x){
 const value=String(x??'').trim();if(!value)return '';
 if(/^\d{4}-(0[1-9]|1[0-2])$/.test(value))return value;
 const m=value.match(/^(0[1-9]|1[0-2])\/(\d{4})$/);if(m)return m[2]+'-'+m[1];

}
function dateBR(x){if(x===null||x===undefined||x==='')return '';const s=iso(x);return s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4);}
function monthBR(x){const s=monthISO(x);return s?s.slice(5,7)+'/'+s.slice(0,4):'';}
const days=(a,b)=>Math.round((Date.parse(iso(a)+'T00:00:00Z')-Date.parse(iso(b)+'T00:00:00Z'))/86400000);
function money(x){
 let s=String(x??'').trim();if(!s)return null;
 if(/^R\$\s*-\s*$/.test(s))return 0;

 if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
 else if(/^[-+]?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
 if(!/^[-+]?\d+(\.\d+)?$/.test(s))throw Error('Valor monetário inválido: '+x);

}
function financial(base){
 const raw=base.raw||{},keys=['Vlr Orc MO','Vlr Orc Misc','Vlr Orc MUT'];const components={},missing=[];
 for(const key of keys){const h=Object.keys(raw).find(h=>norm(h)===norm(key));try{components[key]=money(h===undefined?'':raw[h]);}catch{components[key]=null;}if(components[key]===null)missing.push(key);}

function parseCSV(text, delimiter){

function readBase(parsed,mapping={}){

// Pais são cabeçalhos derivados; somente os registros reais entram no estado.
const isParent=os=>String(os).endsWith('00');
const parentId=os=>String(os).length>=2?String(os).slice(0,-2)+'00':String(os);
function groupIndex(state){
 const map=new Map();for(const r of Object.values(state.records)){const id=parentId(r.os);if(!map.has(id))map.set(id,{id,parent:null,children:[]});const g=map.get(id);if(isParent(r.os))g.parent=r;else g.children.push(r);}
 return map;
}
function aggregateStage(rows,order=DEFAULT_STAGES){
 const stages=[...new Set(rows.map(r=>r.stage??r.base?.stage??''))];if(!stages.length)return {stage:'Sem filhas na base',unknown:[]};

 if(unknown.length)return {stage:'Etapa a revisar',unknown};
 return {stage:stages.sort((a,b)=>ranks.get(norm(a))-ranks.get(norm(b)))[0],unknown:[]};
}
function groupViews(state,date=today(),month=date.slice(0,7)){
 const index=groupIndex(state),rows=ranked(state),rowById=new Map(rows.map(r=>[r.os,publicRow(state,r,date,month)])),out=[];
 for(const g of index.values()){
  const active=g.children.filter(r=>r.present),retained=g.children.filter(r=>!r.present),sources=[...(g.parent?[g.parent]:[]),...g.children.slice().sort((a,b)=>a.os.localeCompare(b.os))];
  const identity={},warnings=[];for(const [key,label] of [['client','Cliente'],['serial','Série'],['model','Modelo']]){identity[key]=sources.find(r=>String(r.base[key]??'').trim())?.base[key]||'';const values=[...new Set(sources.map(r=>r.base[key]).filter(Boolean))];if(new Set(values.map(norm)).size>1)warnings.push(label+': '+values.join(' / '));}
  const agg=aggregateStage(active,state.config.stageOrder||DEFAULT_STAGES);if(agg.unknown.length)warnings.push('Etapas não configuradas: '+agg.unknown.map(x=>x||'(vazia)').join(', '));
  out.push({id:g.id,...identity,sourceOrigins:[...new Set(sources.map(r=>r.base.origin).filter(Boolean))],origin:g.parent?'Base':'Gerado',parentPresent:!!g.parent?.present,parentBaseStage:g.parent?.base.stage||'',stage:agg.stage,warnings,activeCount:active.length,relatedCount:retained.length,children:active.map(r=>rowById.get(r.os)),related:retained.map(r=>({...publicRow(state,r,date,month),absentSince:r.absentSince,present:false}))});

}
function relatedRows(state,os,date=today()){

}
function empty(){
 const labels=[['Em andamento',false],['Aguardando peças',true],['Aguardando outro setor ou terceiro',true],['Aguardando envio do orçamento',true],['Aguardando negociação/aprovação',true],['Aguardando programação/recurso',true],['Aguardando teste/liberação',true],['Aguardando providência administrativa',true],['Outro',false],['A confirmar',false]];
 return {schemaVersion:VERSION,instanceId:uid('gestao'),createdAt:new Date().toISOString(),baseDate:'',lastFullDate:'',records:{},dims:{planners:[],commercials:[],managers:[],situations:labels.map(([name,blocked],i)=>({id:'sit_'+(i+1),name,blocked,requiresDetail:name==='Outro',active:true,order:i}))},config:{priorityCount:15,staleDays:7,retentionDays:7,panelLink:'',emailLimit:20,stageOrder:[...DEFAULT_STAGES]},rounds:[],imports:[],purgedCount:0};
}
const opEmpty=()=>Object.fromEntries(FIELDS.map(k=>[k,'']));
const resolve=(state,kind,name)=>{const matches=state.dims[kind].filter(d=>d.active!==false&&[d.name,...(d.aliases||[])].some(a=>norm(a)===norm(name)));return matches.length===1?matches[0].id:'';};

function dimSave(state,kind,dim){
 const other=state.dims[kind].filter(d=>d.id!==dim.id);if(!dim.name?.trim())throw Error('Informe um nome.');
 if(kind!=='situations'&&kind!=='managers'){const aliases=[dim.name,...(dim.aliases||[])].map(norm);for(const d of other.filter(d=>d.active!==false)){if([d.name,...(d.aliases||[])].some(a=>aliases.includes(norm(a))))throw Error('Nome/alias já usado por '+d.name);}}

const event=(r,type,data)=>{r.history.push({at:new Date().toISOString(),type,...data});};
// Revisões de etapa são monotônicas: inclusive quando uma etapa muda e depois retorna.
function stageInfo(r){

 let revision=0,confirmed=-1,date='';for(const h of r.history){if(h.type==='base'&&h.fromStage!==h.toStage){revision++;date=h.date||'';}if(['operacional','confirmacao'].includes(h.type))confirmed=revision;}

}
function invoiceInfo(r,month){
 const revised=r.invoiceOrigin!=='Base'&&r.op.invoice&&r.op.invoiceMonth===month;
 return {value:revised?r.op.invoice:(['Sim','Não'].includes(r.base.invoiceBase)?r.base.invoiceBase:'A confirmar'),origin:revised?'Revisada':'Base',month};
}
function plannerOp(r,month){return {...clone(r.op),invoice:invoiceInfo(r,month).value,invoiceMonth:month};}
function publicTimeline(state,r){

  if(h.type==='entrada')timeline.push({type:'Base',date:h.date||'',situation:h.stage||'',summary:'Primeira base registrada'});
  if(h.type==='base'&&h.fromStage!==h.toStage){if(!timeline.length)timeline.push({type:'Base',date:'',situation:h.fromStage||'',summary:'Etapa anterior registrada'});timeline.push({type:'Base',date:h.date||'',situation:h.toStage||'',summary:'Alteração da etapa da base'});}

}
// As duas origens são consolidadas antes de qualquer efeito de presença/retencão.
function mergeSources(state,rentavel,garantia,refDate,full=true){

function roundFiles(round){

  else files.push({plannerId,origin:''});

}
// Comparação dos dados consumidos pelo painel; raw continua atualizado integralmente.
function trackedBase(base){

 for(const key of ['os','client','model','serial','service','plannerName','commercialName','stage','invoiceBase','origin'])out[key]=text(base[key]);

}
function baseChanges(before,after){const a=trackedBase(before),b=trackedBase(after);return [...new Set([...Object.keys(a),...Object.keys(b)])].filter(key=>(a[key]??null)!==(b[key]??null));}

er-alerts\">\u003csummary aria-label=\"Notificações da carteira\" title=\"Notificações\">\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\">\u003cpath d=\"M6 9a6 6 0 0 1 12 0v6l2 3H4l2-3V9m4 12h4\"/>\u003c/svg>\u003cb id=\"alertCount\">0\u003c/b>\u003c/summary>\u003cdiv id=\"alertsBody\" class=\"alerts-popover\">\u003c/div>\u003c/details>\u003clabel class=\"user-picker\">\u003cspan class=\"avatar\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\" width=\"19\" height=\"19\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\">\u003ccircle cx=\"12\" cy=\"8\" r=\"3.5\"/>\u003cpath d=\"M5 21v-2a7 7 0 0 1 14 0v2\"/>\u003c/svg>\u003c/span>\u003cspan class=\"sr-only\">Visualizar carteira de\u003c/span>\u003cselect id=\"commercialSelect\" aria-label=\"Escolher comercial ou visão Geral\">\u003c/select>\u003c/label>\u003c/div>\u003c/header>\n\u003cmain class=\"wrap\">\u003csection class=\"overview\" aria-label=\"Visão comercial\">\n\u003cdiv class=\"search-filter-row\">\u003cdiv id=\"quickFilters\" class=\"quick-filters\">\u003c/div>\u003cdiv class=\"filterbar\">\u003cdetails id=\"filterbox\" class=\"filterbox\">\u003csummary>\u003cspan class=\"filter-name\" id=\"filterLabel\">\u003c/span>\u003cspan class=\"filter-overview\" id=\"filterSummary\">Toda a carteira\u003c/span>\u003cspan class=\"filter-toggle-hint\">\u003cspan class=\"when-closed\">Abrir filtros\u003c/span>\u003cspan class=\"when-open\">Recolher filtros\u003c/span>\u003c/span>\u003cspan class=\"chevron\" id=\"filterChevron\">\u003c/span>\u003c/summary>\u003c/details>\u003cbutton id=\"resetAll\" class=\"reset-button\" title=\"Limpar todos os filtros e voltar à carteira completa\" aria-label=\"Limpar todos os filtros\">\u003c/button>\u003c/div>\n\u003c/div>\u003cdiv id=\"filterContent\" class=\"filtercontent commercial-filter-panel\" hidden>\u003c/div>\u003cdiv id=\"activeFilters\" class=\"active-filters\">\u003c/div>\u003cdiv class=\"executive-overview\">\u003cdiv class=\"overview-metrics\">\u003cdiv class=\"cards\" id=\"cards\" aria-live=\"polite\">\u003c/div>\u003cp class=\"operational-note\" id=\"blockedNote\">\u003c/p>\n\u003c/div>\u003csection class=\"chart-panel\" aria-label=\"Distribuição da carteira\">\u003cdiv class=\"chart-head\">\u003cdiv>\u003ch2 id=\"chartTitle\">Peças por etapa da base\u003c/h2>\u003cp class=\"chart-sub\" id=\"chartSubtitle\">\u003c/p>\u003c/div>\u003cdiv class=\"chart-actions\">\u003cbutton id=\"operationalToggle\" class=\"mode-btn\" aria-pressed=\"false\" title=\"Exibir apenas OSs com situação operacional confirmada e recente\">\u003c/button>\u003cdiv class=\"segmented\" aria-label=\"Medida do gráfico\">\u003cbutton id=\"measureValue\" aria-pressed=\"true\" title=\"Somar valor orçado de peças\">Valor de peças\u003c/button>\u003cbutton id=\"measureCount\" aria-pressed=\"false\" title=\"Contar OSs\">Nº de OSs\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"chart\" class=\"chart-body\" aria-live=\"polite\">\u003c/div>\u003cdiv class=\"chart-foot\">\u003cspan id=\"chartLegend\" class=\"legend\">\u003c/span>\u003cspan id=\"chartTotal\">\u003c/span>\u003c/div>\u003c/section>\n\u003c/div>\u003ca href=\"#carteira\" class=\"scroll-cue\" id=\"scrollCue\">\u003c/a>\n\u003c/section>\n\u003csection id=\"carteira\" class=\"table-section\" aria-label=\"Carteira detalhada\">\u003cdiv class=\"table-panel\">\u003cdiv class=\"table-head\">\u003cdiv class=\"table-heading\">\u003ch2>Carteira de OSs\u003c/h2>\u003cp class=\"subhead\" id=\"tableCount\">\u003c/p>\u003cdiv id=\"quickStages\" class=\"quick-stages\" role=\"group\" aria-label=\"Filtrar por etapa da base\">\u003c/div>\u003c/div>\u003cdiv class=\"table-tools\">\u003cdiv id=\"tableTools\" class=\"table-actions\">\u003c/div>\u003cspan id=\"extraTableTools\" class=\"extra-tools\">\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"tablewrap\" id=\"table\" tabindex=\"0\" role=\"region\" aria-label=\"Tabela de OSs com rolagem horizontal e vertical\">\u003c/div>\u003cdiv class=\"pagination\" id=\"pagination\">\u003c/div>\u003c/div>\u003c/section>\u003c/main>\n\u003cdialog id=\"modal\">\u003cheader>\u003ch2 id=\"modalTitle\">\u003c/h2>\u003cbutton id=\"expandDetail\" title=\"Ampliar detalhe\" aria-label=\"Ampliar detalhe\">⛶\u003c/button>\u003cbutton class=\"icon-btn\" id=\"closeModal\" title=\"Fechar detalhes\" aria-label=\"Fechar detalhes\">\u003c/button>\u003c/header>\u003cdiv class=\"body\" id=\"modalBody\">\u003c/div>\u003c/dialog>\u003cdiv id=\"toast\" class=\"toast\" hidden role=\"status\">\u003c/div>\n\u003caside id=\"guidedTour\" class=\"guided-tour\" hidden role=\"dialog\" aria-label=\"Tutorial do painel\" aria-modal=\"false\">\u003cdiv class=\"tour-heading\">\u003cspan id=\"tourStep\">\u003c/span>\u003cbutton id=\"tourClose\" aria-label=\"Fechar tutorial\">×\u003c/button>\u003c/div>\u003ch3 id=\"tourTitle\">\u003c/h3>\u003cp id=\"tourText\" aria-live=\"polite\">\u003c/p>\u003cfooter>\u003cbutton id=\"tourPrevious\">Anterior\u003c/button>\u003cbutton id=\"tourNext\">Próximo\u003c/button>\u003c/footer>\u003c/aside>\n\u003cscript>/* Regras independentes da interface. Não realiza I/O nem envio. */\n(function(root){\n'use strict';\nconst ORIGINS=['Rentável','Garantia'];\nconst DEFAULT_STAGES=['Orçamento','Negociação','Gerar OV','Execução','Concluso'];\nconst VERSION=1, REQUIRED=['OS','Planejador','Responsável Comercial','Status Real','Vlr Orc Peça'];\nconst FIELDS=['situationId','summary','internal','nextAction','actionOwner','actionDue','completion','invoice','invoiceMonth'];\nconst clone=x=>JSON.parse(JSON.stringify(x));\nconst norm=x=>String(x??'').trim().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase();\n// Equivale a remover \"/\" e tudo depois, seguido de ARRUMAR, só nos responsáveis da base.\nconst firstPerson=x=>String(x??'').split('/')[0].replace(/\\s+/g,' ').trim();\nconst uid=p=>p+'_'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'_'+Math.random().toString(36).slice(2));\nconst today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());\nfunction iso(x){\n if(x instanceof Date) return x.toISOString().slice(0,10);\n if(typeof x==='number' && Number.isFinite(x)) return new Date(Date.UTC(1899,11,30)+Math.round(x)*86400000).toISOString().slice(0,10);\n let s=String(x??'').trim(); if(!s)return '';\n let y,m,d, z;if((z=s.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/))){[,y,m,d]=z;}\n else if((z=s.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/))){[,d,m,y]=z;}else throw Error('Data inválida: '+s);\n const dt=new Date(Date.UTC(+y,+m-1,+d)); if(+y\u003c1900||dt.getUTCFullYear()!==+y||dt.getUTCMonth()!==+m-1||dt.getUTCDate()!==+d)throw Error('Data inválida: '+s);\n return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;\n}\nfunction monthISO(x){\n const value=String(x??'').trim();if(!value)return '';\n if(/^\\d{4}-(0[1-9]|1[0-2])$/.test(value))return value;\n const m=value.match(/^(0[1-9]|1[0-2])\\/(\\d{4})$/);if(m)return m[2]+'-'+m[1];\n throw Error('Mês inválido. Use MM/AAAA.');\n}\nfunction dateBR(x){if(x===null||x===undefined||x==='')return '';const s=iso(x);return s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4);}\nfunction monthBR(x){const s=monthISO(x);return s?s.slice(5,7)+'/'+s.slice(0,4):'';}\nconst days=(a,b)=>Math.round((Date.parse(iso(a)+'T00:00:00Z')-Date.parse(iso(b)+'T00:00:00Z'))/86400000);\nfunction money(x){\n let s=String(x??'').trim();if(!s)return null;\n if(/^R\\$\\s*-\\s*$/.test(s))return 0;\n s=s.replace(/R\\$/g,'').replace(/\\s/g,'');\n if(s.includes(','))s=s.replace(/\\./g,'').replace(',','.');\n else if(/^[-+]?\\d{1,3}(\\.\\d{3})+$/.test(s))s=s.replace(/\\./g,'');\n if(!/^[-+]?\\d+(\\.\\d+)?$/.test(s))throw Error('Valor monetário inválido: '+x);\n return Number(s);\n}\nfunction financial(base){\n const raw=base.raw||{},keys=['Vlr Orc MO','Vlr Orc Misc','Vlr Orc MUT'];const components={},missing=[];\n for(const key of keys){const h=Object.keys(raw).find(h=>norm(h)===norm(key));try{components[key]=money(h===undefined?'':raw[h]);}catch{components[key]=null;}if(components[key]===null)missing.push(key);}\n const services=missing.length?null:Object.values(components).reduce((s,v)=>s+v,0),parts=typeof base.parts==='number'&&Number.isFinite(base.parts)?base.parts:null;\n return {services,totalValue:parts!==null&&services!==null?parts+services:null,financeMissing:missing,serviceComponents:components};\n}\nfunction parseCSV(text, delimiter){\n text=String(text).replace(/^\\uFEFF/,'');\n if(!delimiter){const first=text.split(/\\r?\\n/,1)[0];const counts={';':0,',':0,'\\t':0};let q=false;for(let i=0;i\u003cfirst.length;i++){if(first[i]==='\"')q=!q;else if(!q&&first[i] in counts)counts[first[i]]++;}delimiter=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];}\n const rows=[];let row=[],cell='',quoted=false;\n for(let i=0;i\u003ctext.length;i++){let ch=text[i];if(ch==='\"'){if(quoted&&text[i+1]==='\"'){cell+='\"';i++;}else if(quoted||!cell)quoted=!quoted;else cell+=ch;}\n else if(ch===delimiter&&!quoted){row.push(cell);cell='';}\n else if((ch==='\\n'||ch==='\\r')&&!quoted){if(ch==='\\r'&&text[i+1]==='\\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';}else cell+=ch;}\n if(quoted)throw Error('CSV contém aspas não fechadas.');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);\n if(!rows.length)throw Error('CSV vazio.');const headers=rows.shift().map(x=>x.trim());if(new Set(headers).size!==headers.length)throw Error('Cabeçalhos repetidos.');\n return {headers,rows,delimiter};\n}\nfunction readBase(parsed,mapping={}){\n const source=k=>mapping[k]||parsed.headers.find(h=>norm(h)===norm(k));\n const missing=REQUIRED.filter(k=>!source(k));if(missing.length)throw Error('Colunas obrigatórias ausentes: '+missing.join(', '));\n const errors=[],seen=new Set(),records=[];\n parsed.rows.forEach((arr,i)=>{if(arr.length!==parsed.headers.length)throw Error('Linha '+(i+2)+': quantidade de colunas diferente do cabeçalho.');\n const raw={};parsed.headers.forEach((h,j)=>raw[h]=String(arr[j]??'').trim());const get=k=>raw[source(k)]??'';\n const os=get('OS');if(['__proto__','constructor','prototype'].includes(os))throw Error('Identificador de OS inválido.');if(!os)throw Error('OS vazia na linha '+(i+2));if(seen.has(os))throw Error('OS duplicada '+os+' na linha '+(i+2));seen.add(os);\n let parts=null;try{parts=money(get('Vlr Orc Peça'));}catch(e){errors.push({os,field:'Vlr Orc Peça',message:e.message});}\n const dates={};for(const k of parsed.headers.filter(k=>/^Data |^Last Labor$/.test(k))){try{dates[k]=iso(raw[k]);}catch(e){dates[k]='';errors.push({os,field:k,message:e.message});}}\n records.push({os,raw,client:get('Cliente'),model:get('Modelo'),serial:get('Série'),service:get('Texto breve'),plannerName:firstPerson(get('Planejador')),commercialName:firstPerson(get('Responsável Comercial')),stage:get('Status Real'),parts,invoiceBase:get('Fatura no mês'),dates});\n });return {records,errors};\n}\n// Pais são cabeçalhos derivados; somente os registros reais entram no estado.\nconst isParent=os=>String(os).endsWith('00');\nconst parentId=os=>String(os).length>=2?String(os).slice(0,-2)+'00':String(os);\nfunction groupIndex(state){\n const map=new Map();for(const r of Object.values(state.records)){const id=parentId(r.os);if(!map.has(id))map.set(id,{id,parent:null,children:[]});const g=map.get(id);if(isParent(r.os))g.parent=r;else g.children.push(r);}\n return map;\n}\nfunction aggregateStage(rows,order=DEFAULT_STAGES){\n const stages=[...new Set(rows.map(r=>r.stage??r.base?.stage??''))];if(!stages.length)return {stage:'Sem filhas na base',unknown:[]};\n const ranks=new Map(order.map((name,i)=>[norm(name),i])),unknown=stages.filter(name=>!ranks.has(norm(name)));\n if(unknown.length)return {stage:'Etapa a revisar',unknown};\n return {stage:stages.sort((a,b)=>ranks.get(norm(a))-ranks.get(norm(b)))[0],unkno  html+='</div><p class="small">O ID permanece estável ao renomear. Desativar preserva os vínculos históricos.</p>';modal('Editar cadastro',html,[{label:'Voltar',action:()=>{close();dims(kind);}},{label:'Salvar cadastro',primary:true,action:()=>{d.name=$('dn').value.trim();d.active=$('da').checked;if(isSit){d.order=+$('do').value;d.blocked=$('db').checked;d.requiresDetail=$('dd').checked;}else{d.email=$('de').value.trim();if(d.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email))throw Error('E-mail inválido.');if(!isManager)d.aliases=$('dal').value.split('\n').map(x=>x.trim()).filter(Boolean);if(kind==='planners')d.substitute=$('ds').value;if(isManager){d.role=$('dr').value;d.scope=$('scope').value;d.scopeIds=$('scopeIds').value.split('\n').map(x=>x.trim()).filter(Boolean);if(d.scope!=='todos'&&!d.scopeIds.length)throw Error('Selecione ao menos um ID para o escopo.');if(d.scope!=='todos'&&d.scopeIds.some(id=>!state.dims[d.scope].some(x=>x.id===id)))throw Error('Escopo contém ID desconhecido.');}}C.dimSave(state,kind,d);mutate();close();dims(kind);}}]);if(kind==='planners')$('ds').value=d.substitute||'';if(isManager)$('scope').value=d.scope||'todos';}
async function roundExport(){const unknown=C.ranked(state).filter(r=>!C.ORIGINS.includes(r.base.origin));const month=C.today().slice(0,7),missing=unresolved().filter(x=>x.kind==='planners');modal('Gerar rodada dos planejadores',`<label>Mês de referência de faturamento<input type="text" inputmode="numeric" data-month placeholder="mm/aaaa" maxlength="7" id="roundMonth" value="${C.monthBR(month)}"></label>${unknown.length?`<div class="notice">${unknown.length} OS(s) ainda sem origem. Importe os dois CSVs antes de gerar os arquivos separados.</div>`:''}<p>Será gerado um Excel por planejador e origem (Rentável / Garantia), apenas quando houver OSs. Somente filhas presentes na base serão exportadas, com a OS pai de referência. As informações conhecidas serão preservadas. Nova confirmação começa vazia. Cada arquivo terá as prioridades no topo.</p>${missing.length?`<div class="notice">${missing.length} nome(s) de planejador sem associação não terão arquivo. Resolva em Cadastros para incluí-los.</div>`:''}<p class="small">Extraia o ZIP em uma pasta nova da rodada. Não substitua planilhas em edição.</p>`,[{label:'Gerar ZIP',primary:true,action:async()=>{if(unknown.length)throw Error('Importe Rentável e Garantia para identificar a origem das OSs.');const round=C.createRound(state,$('roundMonth').value),zip=new JSZip();for(const file of C.roundFiles(round)){const id=file.plannerId,d=state.dims.planners.find(p=>p.id===id),bytes=await X.plannerFile(state,round,id,file.origin);zip.file(`${X.safeName(d.name)}_${X.safeName(file.origin)}_${C.today()}_${round.planners.indexOf(id)+1}.xlsx`,bytes);}zip.file('INSTRUCOES.txt',`Rodada ${round.id}\nBase ${C.dateBR(round.baseDate)}\nAtualize os campos amarelos. Se conferiu, preencha Nova confirmação. Sem verificação, preserve a data anterior.\nNão substitua arquivos de outra rodada.\n`);state.rounds.push(round);mutate();zip.file('Acompanhamento_OS.json',stampCopy());const bytes=await zip.generateAsync({type:'uint8array',compression:'DEFLATE' async function importAnswers(files){const items=[],reports=[];for(const file of files){try{const parsed=await X.parseAnswer(await file.arrayBuffer(),state);parsed.items.forEach(i=>{i.file=file.name;i.sent=parsed.round.entries[i.os]?.op||{};});items.push(...parsed.items);reports.push({name:file.name,rows:parsed.items.length});}catch(e){reports.push({name:file.name,error:e.message});}}
 C.combineAnswers(items);const labels={change:'Conteúdo atualizado',confirm:'Confirmação renovada',unchanged:'Igual, sem nova confirmação',duplicate:'Resposta já aplicada ou repetida',old:'Confirmação anterior à vigente',conflict:'Requer comparação',error:'Corrigir preenchimento'},counts={};items.forEach(i=>counts[i.status]=(counts[i.status]||0)+1);
 const guidance=i=>/confirmação/i.test(i.reason)?'Confira a coluna Nova confirmação: use a data em que verificou a informação.':/situação/i.test(i.reason)?'Confira a coluna Situação operacional e escolha uma opção do catálogo da rodada.':/data|prazo/i.test(i.reason)?'Confira Prazo da ação e Previsão de conclusão; use dd/mm/aaaa.':'Confira o campo indicado no motivo e reimporte a planilha corrigida.';
 const diff=i=>{const now=state.records[i.os]?.op||{};const keys=C.FIELDS.filter(k=>new Set([i.sent?.[k]||'',now[k]||'',i.op?.[k]||'']).size>1);return `<table class="conflict-fields"><thead><tr><th>Campo</th><th>Enviado na rodada</th><th>Atual no gerencial</th><th>Resposta recebida</th></tr></thead><tbody>${keys.map(k=>`<tr><td>${OSUX.fieldNames[k]||k}</td>${[i.sent,now,i.op].map(v=>`<td>${U.esc(OSUX.value(v?.[k],k,state))}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="4">Sem diferença de conteúdo. Confira data, etapa, origem ou responsável no motivo acima.</td></tr>'}</tbody></table>`;};
 const problem=items.filter(i=>['error','old','conflict'].includes(i.status));
 modal('Conferir respostas dos planejadores',`<div class="response-summary">${Object.entries(labels).map(([k,l])=>`<span><b>${counts[k]||0}</b> ${l}</span>`).join('')}</div><details><summary>Resultado por arquivo</summary>${reports.map(r=>`<p><b>${U.esc(r.name)}</b> · ${r.error?U.esc(r.error):r.rows+' linhas lidas'}</p>`).join('')}</details><p class="small">As linhas válidas podem ser aplicadas agora. Sem nova confirmação, o conteúdo anterior permanece.</p>${problem.map(i=>{const ix=items.indexOf(i);return `<section class="box"><b>OS ${U.esc(i.os)} · ${labels[i.status]}</b><p class="small">${U.esc(i.file)}${i.row?' · linha '+i.row:''}</p><p>${U.esc(i.reason)}</p>${i.status==='conflict'?diff(i)+`<label>Decisão<select data-choice="${ix}"><option value="">Manter atual</option>${!i.disabledSituation?'<option value="received">Aceitar resposta recebida</option>':''}</select></label>`:`<p>${guidance(i)}</p>`}</section>`;}).join('')}<details><summary>Consultar todas as linhas (${items.length})</summary>${items.map(i=>`<p>OS ${U.esc(i.os)} · ${labels[i.status]} · ${U.esc(i.reason)}</p>`).join('')}</details><button id="downloadIssues">Baixar relatório de conferência</button>`,[{label:'Aplicar '+items.filter(i=>['change','confirm'].includes(i.status)).length+' atualizações válidas',primary:true,action:()=>{document.querySelectorAll('[data-choice]').forEach(el=>items[+el.dataset.choice].choice=el.value);const res=C.applyAnswers(state,items);items.forEach(i=>i.outcome=i.choice==='received'&&['change','confirm','conflict'].includes(i.status)?'Consolidada':'Preservada, sem alteração');mutate(res.state);close();modal('Resultado da consolidação',`<p><b>${res.stats.applied} OSs consolidadas.</b> As demais informações foram preservadas.</p><p>${problem.length} linhas identificadas para conferência neste lote. Os erros podem ser corrigidos na planilha e reimportados; respostas já aplicadas serão reconhecidas.</p><button id="downloadIssuesDone">Baixar relatório de conferência</button>`,
